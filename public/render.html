<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Model Snapshot Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 700px;
      height: 700px;
      background: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #F5F2EB 60%, #EAE4D6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
  </style>
  <script type="module" src="/js/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer
    id="viewer"
    camera-controls
    bounds="tight"
    camera-target="auto auto auto"
    camera-orbit="25deg 78deg 135%"
    min-camera-orbit="auto auto 40%"
    max-camera-orbit="auto auto 250%"
    shadow-intensity="1.2"
    shadow-softness="0.75"
    exposure="1.08"
    style="width: 100%; height: 100%;"
  ></model-viewer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const model = params.get('model') || '/models/pot.glb';
    const viewer = document.getElementById('viewer');
    viewer.src = model;
    viewer.addEventListener('load', () => {
      try {
        const center = viewer.getBoundingBoxCenter();
        const dims = viewer.getDimensions();
        if (center && dims) {
          viewer.cameraTarget = `${center.x}m ${center.y}m ${center.z}m`;
          viewer.cameraOrbit = `25deg 78deg 135%`;
          viewer.jumpCameraToGoal();
        }
      } catch (e) {
        console.error(e);
      }
      setTimeout(() => {
        document.body.classList.add('model-loaded');
        console.log('MODEL_LOADED_SUCCESS');
      }, 400);
    });
  </script>
</body>
</html>
